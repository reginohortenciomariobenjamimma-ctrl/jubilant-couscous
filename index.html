<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cuscuz Jubilante</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#06142f;
    color:white;
    min-height:100vh;
}

header{
    height:70px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#081d3d;
    border-bottom:1px solid #183d6b;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#00d4ff;
}

.online{
    font-size:13px;
    color:#53e88b;
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}

.welcome{
    text-align:center;
    padding:25px 10px;
}

.welcome h1{
    font-size:30px;
    color:#00d4ff;
    margin-bottom:10px;
}

.welcome p{
    color:#b9c8dc;
}

.chat{
    background:#0b2144;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #194572;
    box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.chat-title{
    padding:16px;
    background:#0d2a52;
    border-bottom:1px solid #194572;
    font-weight:bold;
}

.messages{
    min-height:350px;
    max-height:500px;
    overflow-y:auto;
    padding:18px;
}

.message{
    margin-bottom:15px;
    display:flex;
    flex-direction:column;
}

.message.user{
    align-items:flex-end;
}

.name{
    font-size:12px;
    color:#8da8c9;
    margin-bottom:5px;
}

.bubble{
    max-width:80%;
    padding:12px 15px;
    border-radius:15px;
    background:#17365f;
    line-height:1.4;
}

.user .bubble{
    background:#087bb8;
}

.input-area{
    display:flex;
    gap:10px;
    padding:15px;
    background:#081d3d;
    border-top:1px solid #194572;
}

#messageInput{
    flex:1;
    border:0;
    outline:0;
    padding:14px;
    border-radius:25px;
    background:#102d53;
    color:white;
    font-size:16px;
}

#messageInput::placeholder{
    color:#8197b4;
}

button{
    border:0;
    border-radius:25px;
    padding:0 22px;
    background:#00a8df;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

button:active{
    transform:scale(.96);
}
