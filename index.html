<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conecta+</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#06142f;
  color:white;
  min-height:100vh;
}

header{
  height:70px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#081d3d;
  border-bottom:1px solid #18345b;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:25px;
  font-weight:bold;
}

.logo-icon{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:linear-gradient(135deg,#00d4ff,#087cff);
}

.logo-name{
  color:#20ddff;
}

.entrar-topo{
  padding:10px 18px;
  border-radius:22px;
  border:1px solid #386087;
  background:transparent;
  color:white;
}

.hero{
  text-align:center;
  padding:55px 20px 30px;
}

.hero h1{
  font-size:42px;
  line-height:1.1;
  margin-bottom:20px;
}

.azul{
  color:#19eaff;
}

.verde{
  color:#31ed49;
}

.hero p{
  max-width:650px;
  margin:auto;
  color:#b8c8df;
  font-size:17px;
  line-height:1.6;
}

.botoes{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:25px;
  flex-wrap:wrap;
}

.botao{
  padding:14px 28px;
  border-radius:30px;
  border:none;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.botao-principal{
  background:linear-gradient(90deg,#087cff,#16d9ff);
}

.botao-secundario{
